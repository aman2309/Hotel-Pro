name: my_first_app
description: "Hotel Pro — commercial hotel manager."

publish_to: 'none'

version: 1.0.11+19

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  pdf: ^3.13.0
  printing: ^5.15.0
  file_picker: ^11.0.2
  file_saver: ^0.4.0
  http: ^1.2.2
  crypto: ^3.0.6
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.4
  cloud_functions: ^6.0.2
  image: ^4.5.4
  get: ^4.7.3
  firebase_app_check: ^0.4.9
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/hotel_logo.png
    - assets/fonts/OFL.txt

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
